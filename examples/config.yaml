# Example ranet-lite config. See internal/config/config.go for the full
# schema and defaults, and internal/registry/testdata/registry.json for a
# worked example of the registry.json this points at.
#
# Optional YAML lines start with "# " followed by a lowercase key or list
# item, possibly indented. Enable an option by removing only "# ", keeping
# the remaining indentation. Enable its parent keys and list items together.

# Identity: must match an entry for this org/node/serial in the registry
# below, and private_key must be that organization's shared Ed25519 key.
organization: example
common_name: my-laptop
port: 13000
endpoints:
  - serial_number: "0"
    address_family: ip4

private_key: /etc/ranet-lite/key.pem      # PKCS8 PEM Ed25519 private key
registry: /etc/ranet-lite/registry.json   # same registry.json ranet itself uses

# Prefixes this node announces via babel as reachable through itself
# (e.g. its own tunnel address). Leave empty if this node only consumes
# routes and never originates any.
originate:
  - "10.66.0.5/32"

# Optional anti-replay window, in packets. Omitted it is 4096, which is wider
# than the interoperable minimum on purpose: a multicore sender reorders bursts
# by more than 32 before they reach userspace. Set 0 to disable replay checking.
# replay_window: 4096

# Proactive rekey intervals default to 1h for Child SAs and 3h for IKE SAs.
# Set either to 0 to disable it. Rekeys run interval minus the 5m margin and
# an independently random 0-1m jitter. Margin plus jitter must be shorter
# than every enabled interval.
# child_rekey_interval: 1h
# ike_rekey_interval: 3h
# rekey_margin: 5m
# rekey_jitter: 1m
# Failed scheduled rekeys retry after 5s, doubling up to 5m. Both must be
# positive and the initial delay cannot exceed the maximum.
# rekey_retry_initial: 5s
# rekey_retry_max: 5m

# One or more existing mesh nodes to dial as IKEv2/babel peers. Each local
# endpoint only dials remote endpoints with the same address family.
# Answer peers that dial us as well as dialing. Off by default; required for a
# full mesh, where every node both dials and answers.
# responder: true

peers:
  - organization: example       # optional, defaults to the top-level organization
    common_name: gateway
    serial_number: "0"          # optional, picks a specific endpoint if the node has several

babel:
  # Omitted these default to 4s and 16s, which is what BIRD and RFC 8966
  # Appendix B use and what the fleet configures. Raise them on a node that
  # would rather wake less often.
  hello_interval: 4s
  update_interval: 16s

  # Optional link costs use the BIRD interface option names.
  # rxcost: 96
  # rtt_cost: 1024
  # rtt_min: 0s
  # rtt_max: 1024ms

  # Optional announcements also support a source prefix, which the top-level
  # originate list cannot express. Enable the list and its entries together.
  # originate:
  #   - 2001:db8:1::/48                      # a plain prefix, same as originate
  #   - { prefix: "::/0", from: "2001:db8:1::/48" }  # an exit's default

# Optional: use this TUN name. WireGuard's TUN backend attaches when the
# interface already exists, or creates it if it does not. Omit it to create
# an automatically named ranet%d interface.
# tun: ranet0

# ranet-lite creates a TUN device by default (its name is logged on startup) but
# never touches its address or routes itself unless kernel mode is enabled.
# Otherwise, after starting it, assign an address and add routes yourself, e.g.:
#   ip addr add 10.66.0.5/32 dev ranet0
#   ip route add ::/0 dev ranet0

# Optional: mirror the routes babel learns into a routing table of its own,
# taking over from BIRD's kernel protocols. Off unless enabled. The reconciler
# deletes only routes carrying its own protocol, in its own table, out of the
# TUN, and an install refuses a key another writer already holds rather than
# taking it over. Give it a table no other daemon writes, or the routes it
# refuses are routes the mesh wanted.
# kernel:
#   enabled: true
#   table: 200
#   protocol: 155
#   metric: 64                    # BIRD's kbabel uses 32, so not 32 while it shares this table
#   prefsrc4: 10.66.0.5
#   addresses: ["10.66.0.5/32"]
#   assign_originated: false
#   vrf: gravity
#   reconcile_interval: 30s
